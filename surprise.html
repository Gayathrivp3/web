<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Final Surprise</title>
  <style>
    body {
      margin: 0;
      font-family: 'Times New Roman', serif;
      background: linear-gradient(rgba(255,192,203,0.4), rgba(255,182,193,0.4)),
                  url('Untitled design.png') center/cover no-repeat; /* 💖 Replace with your photo */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      position: relative;
      animation: fadeIn 2s ease forwards;
    }

    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }

    .container {
      text-align: center;
      background: rgba(255,255,255,0.2);
      padding: 40px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      color: #4a0e0e;
      z-index: 2;
    }

    h1 {
      font-size: 2.5rem;
      text-shadow: 0 0 15px #ff6f61, 0 0 25px #ffe066;
      margin-bottom: 20px;
      animation: glowText 2s ease-in-out infinite alternate;
    }

    @keyframes glowText {
      from {text-shadow: 0 0 10px #ff6f61;}
      to {text-shadow: 0 0 25px #ffe066, 0 0 40px #ff6f61;}
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 30px;
    }

    button {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      background: #ff6f61;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% {transform: scale(1);}
      50% {transform: scale(1.1);}
      100% {transform: scale(1);}
    }

    /* Falling sparkles */
    .sparkle {
      position: absolute;
      font-size: 20px;
      color: gold;
      animation: fallSparkles 6s linear infinite;
    }

    @keyframes fallSparkles {
      from {top: -10%; opacity: 1;}
      to {top: 110%; opacity: 0;}
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Forever Yours 💖</h1>
    <p>You are my happiness, my crazy, my everything ✨</p>
    <button onclick="window.location.href='index.html'">Replay 🔄</button>
  </div>

  <!-- Falling sparkles -->
  <div class="sparkle" style="left:15%;">✨</div>
  <div class="sparkle" style="left:40%;">✨</div>
  <div class="sparkle" style="left:65%;">✨</div>
  <div class="sparkle" style="left:85%;">✨</div>
</body>
</html>
